name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  compat:
    name: Compile against Spigot ${{ matrix.spigot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spigot: ['1.13.2', '1.16.5', '1.17.1', '1.18.2', '1.19.4', '1.20.1', '1.20.6', '1.21.1', '1.21.4', '1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B compile -Dspigot.version=${{ matrix.spigot }}-R0.1-SNAPSHOT

  build:
    runs-on: ubuntu-latest
    needs: compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: Storage
          path: target/Storage-*.jar
          if-no-files-found: error
