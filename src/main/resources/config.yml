# Storage configuration

# Message language. Files are in plugins/Storage/lang/ (bundled: en, ja)
language: en

# Cost to register a new item. Requires Vault and an economy plugin.
# Set to 0 (or run without Vault) to make registration free.
registration-cost: 30000

# Number of GUI pages (45 items per page, 1-9)
max-pages: 9

auto-collect:
  # Picked-up items that are registered and toggled on go straight into Storage.
  # Requires the storage.autocollect permission.
  enabled: true

# Items whose material name contains any of these words cannot be registered.
# Items with a max stack size below 64 are always rejected.
blocklist:
  - SPAWNER
  - AIR
  - BED
  - MAP
  - BOW
  - AXE
  - HOE
  - SIGN
  - BOAT
  - BOOK
  - BOOTS
  - SWORD
  - BANNER
  - BUCKET
  - HELMET
  - SHOVEL
  - POTION
  - PICKAXE
  - A_STICK
  - MINECART
  - LEGGINGS
  - CHESTPLATE
  - SHULKER_BOX
  - HORSE_ARMOR
  - BANNER_PATTERN
  - MUSIC_DISC
  - FISHING_ROD
  - FLINT_AND_STEEL
  - RABBIT_STEW
  - BEETROOT_SOUP
  - MUSHROOM_STEW
  - SUSPICIOUS_STEW
  - HONEY_BOTTLE
  - CAKE
  - ARMOR_STAND
  - TRIDENT
  - SADDLE
  - ELYTRA
  - EGG
  - ENDER_PEARL
  - FIREWORK_ROCKET
  - SHEARS
  - SHIELD
  - TOTEM_OF_UNDYING
