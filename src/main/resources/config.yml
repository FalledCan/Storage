# Storage configuration

# Message language. Files are in plugins/Storage/lang/ (bundled: en, ja)
language: en

# Cost to register a new item. Requires Vault and an economy plugin.
# Set to 0 (or run without Vault) to make registration free.
registration-cost: 30000

# Number of GUI pages (45 items per page, 1-9)
max-pages: 9

auto-collect:
  # Picked-up items that are registered and toggled on go straight into Storage.
  # Requires the storage.autocollect permission.
  enabled: true

# Items that cannot be registered. Use '*' as a wildcard (e.g. *_SPAWN_EGG).
# Without '*' the name must match exactly.
# Items with a max stack size below 64 (tools, armor, potions, shulker boxes,
# ender pearls, signs, ...) are always rejected, so they don't need to be listed.
blocklist:
  - "*SPAWNER"
  - "*_SPAWN_EGG"
  - "*COMMAND_BLOCK"
  - "STRUCTURE_*"
  - "TEST_*"
  - JIGSAW
  - BARRIER
  - LIGHT
  - BEDROCK
  - END_PORTAL_FRAME
  - REINFORCED_DEEPSLATE
